<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f101a" />
      <stop offset="50%" stop-color="#1a1b26" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7aa2f7" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: url(#accent);
      letter-spacing: 1px;
    }
    .greeting {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #9ece6a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      fill: #a9b1d6;
    }
    .pill-bg {
      fill: #24283b;
      stroke: #414868;
      stroke-width: 1;
      rx: 14;
    }
    .pill-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #c0caf5;
    }
    .cursor {
      fill: #7dcfff;
      animation: blink 1.1s step-end infinite;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
  </style>

  <!-- Main Card Background -->
  <rect width="900" height="230" rx="16" fill="url(#bg)" stroke="#292e42" stroke-width="1.5" />
  <rect width="900" height="230" rx="16" fill="url(#grid)" />

  <!-- Decorative Glows -->
  <circle cx="780" cy="60" r="140" fill="url(#glow)" class="pulse-circle" />
  <circle cx="120" cy="190" r="110" fill="url(#glow)" />

  <!-- Top Terminal Bar Dots -->
  <circle cx="28" cy="24" r="6" fill="#f7768e" />
  <circle cx="48" cy="24" r="6" fill="#e0af68" />
  <circle cx="68" cy="24" r="6" fill="#9ece6a" />
  <text x="88" y="28" font-family="Consolas, monospace" font-size="12" fill="#565f89">goover@austria: ~/workspace</text>

  <!-- Content -->
  <text x="50" y="75" class="greeting">Servus &amp; Welcome</text>
  <text x="50" y="125" class="title">Hi, I'm gOOvER</text>

  <text x="50" y="160" class="subtitle">&gt; Passionate Open-Source Builder • Game Server Infrastructure • Desktop &amp; Gaming Tools</text>
  <rect x="815" y="146" width="9" height="17" class="cursor" />

  <!-- Feature Pills -->
  <g transform="translate(50, 182)">
    <rect x="0" y="0" width="215" height="28" class="pill-bg" />
    <text x="14" y="18" class="pill-text">🐳 Pelican &amp; Pterodactyl Eggs</text>

    <rect x="227" y="0" width="175" height="28" class="pill-bg" />
    <text x="241" y="18" class="pill-text">🎮 Playnite Extensions</text>

    <rect x="414" y="0" width="185" height="28" class="pill-bg" />
    <text x="428" y="18" class="pill-text">🚀 Star Citizen Tooling</text>

    <rect x="611" y="0" width="155" height="28" class="pill-bg" />
    <text x="625" y="18" class="pill-text">⚔️ WoW Addons &amp; UI</text>
  </g>
</svg>
